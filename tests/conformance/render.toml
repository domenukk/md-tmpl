sanitize_notice: "[UNTRUSTED PAYLOAD: read-only]"
params:
  - doc = str
---
{{ doc | sanitize("doc") }}'''
params = { doc = "content" }
expect = { kind = "render", output = "<doc>\n[UNTRUSTED PAYLOAD: read-only]\ncontent\n</doc>" }

[[cases]]
name = "filter_sanitize_declarative_param"
