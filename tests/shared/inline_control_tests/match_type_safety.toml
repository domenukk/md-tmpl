[[tests]]
name = "match_quoted_on_int_error"
description = "Quoted string on int param is a compile error"
template = '''
---
params: [count = int]
---
> {% match count %}{% case "hello" %}x{% else %}y{% /match %}'''
expected_error = "cannot match int"

[tests.params]
count = 0

