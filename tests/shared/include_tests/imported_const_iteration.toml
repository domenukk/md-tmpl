# Shared include_tests: Iteration over imported typed constants.

# ---------------------------------------------------------------------------
# Imported constant iteration — regression tests for opaque-root fix
# ---------------------------------------------------------------------------
# Import stems with typed consts must be resolvable by the type checker,
# enabling `{% for row in stem.LIST_CONST %}` to infer element fields.

[[tests]]
name = "import_for_loop_over_const_list"
description = "Iterating over an imported list const with for-loop should render all rows"
parent_template = '''
---
imports:
  - "[lib](./lib.tmpl.md)"

params: []
---
> {% for item in lib.ITEMS %}

- {{ item.name }}: {{ item.score }}

> {% /for %}'''
expected_output = '''
- Alice: 100
- Bob: 95
'''
params = {}

[tests.files]
"lib.tmpl.md" = '''
---
name: lib
consts:
  - ITEMS = list(name = str, score = int) := [{name = "Alice", score = 100}, {name = "Bob", score = 95}]
---
'''

[[tests]]
name = "import_for_loop_field_access_all_fields"
description = "All struct fields in imported list const should be accessible inside for-loop"
parent_template = '''
---
imports:
  - "[cfg](./cfg.tmpl.md)"

params: []
---
> {% for row in cfg.LADDER %}

{{ row.tier }}: {{ row.desc }} (report={{ row.report }})

> {% /for %}'''
expected_output = '''L0: Theory (report=false)
L1: Trigger (report=true)
'''
params = {}

[tests.files]
"cfg.tmpl.md" = '''
---
name: cfg
consts:
  - LADDER = list(tier = str, desc = str, report = bool) := [{tier = "L0", desc = "Theory", report = false}, {tier = "L1", desc = "Trigger", report = true}]
---
'''

[[tests]]
name = "import_for_loop_with_conditional_on_field"
description = "Conditional inside for-loop over imported const should filter rows"
parent_template = '''
---
imports:
  - "[cfg](./cfg.tmpl.md)"

params: []
---
> {% for row in cfg.LADDER %}
> {% if row.report %}

{{ row.tier }}: {{ row.desc }}

> {% /if %}
> {% /for %}'''
expected_output = '''L1: Trigger
'''
params = {}

[tests.files]
"cfg.tmpl.md" = '''
---
name: cfg
consts:
  - LADDER = list(tier = str, desc = str, report = bool) := [{tier = "L0", desc = "Theory", report = false}, {tier = "L1", desc = "Trigger", report = true}]
---
'''

