[[tests]]
name = "import_for_loop_enum_field_in_const_list"
description = "Element struct with an enum-typed field (alias defined in imported template) resolves across import boundary"
parent_template = '''
---
imports:
  - "[lib](./lib.tmpl.md)"

params: []
---
> {% for row in lib.LADDER %}

{{ kind(row.tier) }}: {{ row.desc }}

> {% /for %}'''
expected_output = '''L0: theory
L1: trigger
'''
params = {}

[tests.files]
"lib.tmpl.md" = '''
---
name: lib
allow_unused: true
types:
  - Tier = enum(L0, L1, L2)

consts:
  - LADDER = list(tier = Tier, desc = str) := [{tier = L0, desc = "theory"}, {tier = L1, desc = "trigger"}]
---
'''

[[tests]]
name = "import_for_loop_match_on_enum_field"
description = "match on an enum field of an imported const list element works with exhaustiveness"
parent_template = '''
