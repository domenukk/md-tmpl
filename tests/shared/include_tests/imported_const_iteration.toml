[[tests]]
name = "import_for_loop_multiple_imports_same_template"
description = "For-loops from multiple imports should work independently"
parent_template = '''
---
imports:
  - "[a](./a.tmpl.md)"
  - "[b](./b.tmpl.md)"

params: []
---
> {% for x in a.LIST %}

A:{{ x.v }}

> {% /for %}
> {% for y in b.LIST %}

B:{{ y.v }}

> {% /for %}'''
expected_output = '''A:1
A:2
B:3
'''
params = {}

[tests.files]
"a.tmpl.md" = '''
---
name: a
consts:
  - LIST = list(v = int) := [{v = 1}, {v = 2}]
---
'''
"b.tmpl.md" = '''
---
name: b
consts:
  - LIST = list(v = int) := [{v = 3}]
---
'''

