imports:
  - "[lib](./lib.tmpl.md)"

params: []
---
> {% for row in lib.LADDER %}
> {% match row.tier %}
> {% case L0 %}

low: {{ row.desc }}

> {% case L1 %}

high: {{ row.desc }}

> {% /match %}
> {% /for %}'''
expected_output = '''low: theory
high: trigger
'''
params = {}

[tests.files]
"lib.tmpl.md" = '''
---
name: lib
allow_unused: true
types:
  - Tier = enum(L0, L1)

consts:
  - LADDER = list(tier = Tier, desc = str) := [{tier = L0, desc = "theory"}, {tier = L1, desc = "trigger"}]
---
'''

