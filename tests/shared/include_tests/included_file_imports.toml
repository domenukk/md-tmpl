# Shared include_tests: Imports declared inside included files.

# ---------------------------------------------------------------------------
# Imports in included files
# ---------------------------------------------------------------------------
# When template A {% include %}s template B, template B can have its own
# imports: block in frontmatter. Those imports are resolved relative to
# template B's directory, enabling included files to use strongly typed
# enum params, imported consts, and match/case from imported types.

[[tests]]
name = "included_file_with_own_imports_enum_param"
description = "An included file can import a type-definition file and use its enum type for params"
parent_template = '''
---
params: [role = str]
---
> {% include [child](./child.tmpl.md) with role=role %}'''
expected_output = "Role: admin"

[tests.params]
role = "admin"

[tests.files]
"types.tmpl.md" = '''
---
name: types
types: [Role = enum(admin, editor, viewer)]
---
'''
"child.tmpl.md" = '''
---
imports:
  - "[types](./types.tmpl.md)"

params: [role = types.Role]
---
Role: {{ role }}'''

[[tests]]
name = "included_file_with_imports_match_case"
description = "An included file can import enum types and use match/case dispatch on them"
parent_template = '''
---
params: [severity = str]
---
> {% include [alert](./alert.tmpl.md) with severity=severity %}'''
expected_output = "🔴 Critical!\n"

[tests.params]
severity = "Critical"

[tests.files]
"severity_types.tmpl.md" = '''
---
name: severity_types
types: [Severity = enum(Critical, High, Low)]
---
'''
"alert.tmpl.md" = '''
---
imports:
  - "[severity_types](./severity_types.tmpl.md)"

params: [severity = severity_types.Severity]
---

> {% match severity %}
> {% case Critical %}

🔴 Critical!

> {% case High %}

🟠 High

> {% case Low %}

🟢 Low

> {% /match %}'''

[[tests]]
name = "included_file_with_imports_consts"
description = "An included file can import a template and use its exported constants"
parent_template = '''
---
params: []
---
> {% include [banner](./banner.tmpl.md) %}'''
expected_output = "App: MyApp v2.0"
params = {}

[tests.files]
"config.tmpl.md" = '''
---
name: config
consts:
  - APP_NAME = str := "MyApp"
  - VERSION = str := "2.0"
---
'''
"banner.tmpl.md" = '''
---
imports:
  - "[config](./config.tmpl.md)"

params: []
---
App: {{ config.APP_NAME }} v{{ config.VERSION }}'''

[[tests]]
name = "included_file_with_imports_relative_parent_dir"
description = "An included file in a subdirectory can import from a parent directory using ../"
parent_template = '''
---
params: [prio = str]
---
> {% include [widget](./sub/widget.tmpl.md) with prio=prio %}'''
expected_output = "Priority: High"

[tests.params]
prio = "High"

[tests.files]
"types.tmpl.md" = '''
---
name: types
types: [Priority = enum(High, Medium, Low)]
---
'''
"sub/widget.tmpl.md" = '''
---
imports:
  - "[types](../types.tmpl.md)"

params: [prio = types.Priority]
---
Priority: {{ prio }}'''

[[tests]]
name = "included_file_with_imports_enum_wrong_variant_rejected"
description = "An included file with imported enum type rejects invalid variant values"
parent_template = '''
---
params: [role = str]
---
> {% include [child](./child.tmpl.md) with role=role %}'''
expected_error = "type mismatch"

[tests.params]
role = "superadmin"

[tests.files]
"types.tmpl.md" = '''
---
name: types
types: [Role = enum(admin, editor, viewer)]
---
'''
"child.tmpl.md" = '''
---
imports:
  - "[types](./types.tmpl.md)"

params: [role = types.Role]
---
Role: {{ role }}'''

[[tests]]
name = "nested_includes_each_with_own_imports"
description = "Multiple levels of includes, each with its own independent imports"
parent_template = '''
---
params: [role = str, prio = str]
---
> {% include [level1](./level1.tmpl.md) with role=role, prio=prio %}'''
expected_output = "Role: admin | Priority: High"

[tests.params]
role = "admin"
prio = "High"

[tests.files]
"role_types.tmpl.md" = '''
---
name: role_types
types: [Role = enum(admin, editor)]
---
'''
"prio_types.tmpl.md" = '''
---
name: prio_types
types: [Priority = enum(High, Medium, Low)]
---
'''
"level1.tmpl.md" = '''
---
imports:
  - "[role_types](./role_types.tmpl.md)"

params:
  - role = role_types.Role
  - prio = str
---
Role: {{ role }} | {% include [level2](./level2.tmpl.md) with prio=prio %}'''
"level2.tmpl.md" = '''
---
imports:
  - "[prio_types](./prio_types.tmpl.md)"

params: [prio = prio_types.Priority]
---
Priority: {{ prio }}'''

[[tests]]
name = "included_file_with_imports_kinds_function"
description = "An included file can use kinds() on imported enum types"
parent_template = '''
---
params: []
---
> {% include [lister](./lister.tmpl.md) %}'''
expected_output = "Roles: admin, editor, viewer"
params = {}

[tests.files]
"types.tmpl.md" = '''
---
name: types
types: [Role = enum(admin, editor, viewer)]
---
'''
"lister.tmpl.md" = '''
---
imports:
  - "[types](./types.tmpl.md)"

params: []
---
Roles: {{ kinds(types.Role) | join(", ") }}'''

[[tests]]
name = "included_file_with_imports_and_local_types"
description = "An included file can combine its own local types with imported types"
parent_template = '''
---
params: [role = str, status = str]
---
> {% include [card](./card.tmpl.md) with role=role, status=status %}'''
expected_output = "admin (Active)"

[tests.params]
role = "admin"
status = "Active"

[tests.files]
"role_types.tmpl.md" = '''
---
name: role_types
types: [Role = enum(admin, editor)]
---
'''
"card.tmpl.md" = '''
---
imports:
  - "[role_types](./role_types.tmpl.md)"

types: [Status = enum(Active, Inactive)]

params:
  - role = role_types.Role
  - status = Status
---
{{ role }} ({{ status }})'''

[[tests]]
name = "included_file_with_imports_default_enum_value"
description = "An included file can declare a default value for an imported enum param"
parent_template = '''
---
params: []
---
> {% include [child](./child.tmpl.md) %}'''
expected_output = "Role: viewer"
params = {}

[tests.files]
"types.tmpl.md" = '''
---
name: types
types: [Role = enum(admin, editor, viewer)]
---
'''
"child.tmpl.md" = '''
---
imports:
  - "[types](./types.tmpl.md)"

params:
  - role = types.Role := "viewer"
---
Role: {{ role }}'''

[[tests]]
name = "included_file_with_env_propagation"
description = "An included file receives env values from the parent template's compile-time env"
parent_template = '''
---
params: []
---
> {% include [child](./child.tmpl.md) %}'''
expected_output = "Path: /usr/local/prompts"
params = {}

[tests.env]
BASE_PATH = "/usr/local/prompts"

[tests.files]
"child.tmpl.md" = '''
---
env: [BASE_PATH = str]

params: []
---
Path: {{ BASE_PATH }}'''

[[tests]]
name = "included_file_env_used_in_import_path"
description = "An included file uses env values that are available as constants alongside imports"
parent_template = '''
---
params: [role = str]
---
> {% include [child](./child.tmpl.md) with role=role %}'''
expected_output = "admin @ /prompts"

[tests.params]
role = "admin"

[tests.env]
PROMPT_DIR = "/prompts"

[tests.files]
"types.tmpl.md" = '''
---
name: types
types: [Role = enum(admin, editor)]
---
'''
"child.tmpl.md" = '''
---
env: [PROMPT_DIR = str]

imports:
  - "[types](./types.tmpl.md)"

params: [role = types.Role]
---
{{ role }} @ {{ PROMPT_DIR }}'''
