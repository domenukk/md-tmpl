# Shared include_tests: Include whitespace preservation.

# ---------------------------------------------------------------------------
# Include whitespace preservation tests
# ---------------------------------------------------------------------------

[[tests]]
name = "include_ws_tag_tag_1_blank"
description = "Two includes separated by 1 blank line — all blanks consumed between tags"
parent_template = '''
---
params: [x = str]
---
> {% include [a](./a.tmpl.md) with x=x %}

> {% include [a](./a.tmpl.md) with x=x %}'''
expected_output = "A:1A:1"

[tests.params]
x = "1"

[tests.files]
"a.tmpl.md" = '''
---
params: [x = str]
---
A:{{ x }}'''

