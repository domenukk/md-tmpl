[[tests]]
name = "include_ws_trim_redundant"
description = "Trim modifiers on standalone include tags are redundant — same as non-trim"
parent_template = '''
---
params: [x = str]
---
> {%- include [a](./a.tmpl.md) with x=x -%}

More: {{ x }}'''
expected_output = "A:1More: 1"

[tests.params]
x = "1"

[tests.files]
"a.tmpl.md" = '''
---
params: [x = str]
---
A:{{ x }}'''
