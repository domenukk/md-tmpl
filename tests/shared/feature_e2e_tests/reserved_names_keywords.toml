# Shared feature_e2e_tests: Reserved names, language keywords, and collision guards.

# -- Reserved-name rejection tests (SPEC §Naming Conventions & Collision Rules) --

[[tests]]
name = "reserved_param_name_None"
description = "param named 'None' is rejected — pattern keyword"
template = '''
---
params: [None = str]
---
{{ None }}'''
expected_error = "reserved keyword used as name: 'None'"

[[tests]]
name = "reserved_param_name_Some"
description = "param named 'Some' is rejected — pattern keyword"
template = '''
---
params: [Some = str]
---
{{ Some }}'''
expected_error = "reserved keyword used as name: 'Some'"

[[tests]]
name = "reserved_param_name_true"
description = "param named 'true' is rejected — boolean literal"
template = '''
---
params: [true = str]
---
{{ true }}'''
expected_error = "reserved keyword used as name: 'true'"

[[tests]]
name = "reserved_param_name_false"
description = "param named 'false' is rejected — boolean literal"
template = '''
---
