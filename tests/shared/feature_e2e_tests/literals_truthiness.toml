# Shared feature_e2e_tests: F13 literal expressions and truthiness.

# ============================================================================
# F13: Literal Expressions — bare literals valid in all expression positions
# ============================================================================

[[tests]]
name = "literal_int_output"
description = "Bare integer literal renders as its stringified value"
template = '''
---
params: []
---
{{ 42 }}'''
expected_output = "42"
params = {}

[[tests]]
name = "literal_int_negative"
description = "Negative integer literal renders correctly"
template = '''
---
params: []
---
{{ -7 }}'''
expected_output = "-7"
params = {}

[[tests]]
name = "literal_int_zero"
description = "Zero integer literal renders as 0"
template = '''
---
params: []
---
{{ 0 }}'''
expected_output = "0"
params = {}

[[tests]]
name = "literal_float_output"
description = "Bare float literal renders as its stringified value"
template = '''
---
params: []
---
{{ 3.14 }}'''
expected_output = "3.14"
params = {}

[[tests]]
name = "literal_float_whole_drops_fractional"
description = "Whole-valued float 3.0 renders as 3 (drops .0)"
template = '''
---
params: []
---
{{ 3.0 }}'''
expected_output = "3"
params = {}

[[tests]]
name = "literal_float_negative_zero"
description = "Negative zero float renders as 0"
template = '''
---
params: []
---
{{ -0.0 }}'''
expected_output = "0"
params = {}

[[tests]]
name = "literal_bool_true"
description = "Bare true literal renders as 'true'"
template = '''
---
params: []
---
{{ true }}'''
expected_output = "true"
params = {}

[[tests]]
name = "literal_bool_false"
description = "Bare false literal renders as 'false'"
template = '''
---
params: []
---
{{ false }}'''
expected_output = "false"
params = {}

[[tests]]
name = "literal_string_double_quoted"
description = "String literal in output position renders its contents"
template = '''
---
params: []
---
{{ "hello" }}'''
expected_output = "hello"
params = {}

[[tests]]
name = "literal_string_single_quoted"
description = "Single-quoted string literal renders its contents"
template = '''
---
params: []
---
{{ 'world' }}'''
expected_output = "world"
params = {}

[[tests]]
name = "literal_int_in_condition"
description = "Non-zero integer comparison in conditions"
template = '''
---
params: []
---
> {% if 42 > 0 %}Y{% /if %}'''
expected_output = "Y"
params = {}

[[tests]]
name = "literal_zero_in_condition"
description = "Zero integer comparison in conditions"
template = '''
---
params: []
---
> {% if 0 > 0 %}Y{% else %}N{% /if %}'''
expected_output = "N"
params = {}

[[tests]]
name = "literal_bool_in_condition"
description = "Bool literals work directly in conditions"
template = '''
---
params: []
---
> {% if true %}T{% /if %}{% if false %}F{% /if %}'''
expected_output = "T"
params = {}

[[tests]]
name = "literal_int_comparison"
description = "Integer literal used in equality comparison"
template = '''
---
params: [x = int]
---
> {% if x == 42 %}match{% else %}no{% /if %}'''
expected_output = "match"
[tests.params]
x = 42

[[tests]]
name = "literal_string_filter"
description = "String literal passed through upper filter"
template = '''
---
params: []
---
{{ "hello" | upper }}'''
expected_output = "HELLO"
params = {}

[[tests]]
name = "literal_float_fixed_filter"
description = "Float literal passed through fixed(2) filter"
template = '''
---
params: []
---
{{ 3.0 | fixed(2) }}'''
expected_output = "3.00"
params = {}

[[tests]]
name = "literal_mixed_with_vars"
description = "Literal and variable in same template"
template = '''
---
params: [name = str]
---
{{ "Hello" }} {{ name }}! {{ 42 }}'''
expected_output = "Hello world! 42"
[tests.params]
name = "world"

[[tests]]
name = "literal_in_interpolation"
description = "Literal inside string interpolation"
template = '''
---
params: [x = str]
---
> {% if x == "v{{ 42 }}" %}Y{% else %}N{% /if %}'''
expected_output = "Y"
[tests.params]
x = "v42"

[[tests]]
name = "literal_leading_zeros_normalized"
description = "Leading zeros on integer literals are normalized"
template = '''
---
params: []
---
{{ 007 }}'''
expected_output = "7"
params = {}

[[tests]]
name = "truthy_str_nonempty"
description = "bare truthiness on non-empty string evaluates to true"
template = '''
---
params: [title = str]
---
> {% if title %}title={{ title }}{% else %}no_title{% /if %}'''
expected_output = "title=Hello"
[tests.params]
title = "Hello"

[[tests]]
name = "truthy_str_empty"
description = "bare truthiness on empty string evaluates to false"
template = '''
---
params: [title = str]
---
> {% if title %}title={{ title }}{% else %}no_title{% /if %}'''
expected_output = "no_title"
[tests.params]
title = ""

[[tests]]
name = "truthy_list_nonempty"
description = "bare truthiness on non-empty list evaluates to true"
template = '''
---
params: [items = list(str)]
---
> {% if items %}count={{ len(items) }}{% else %}no_items{% /if %}'''
expected_output = "count=2"
[tests.params]
items = ["a", "b"]

[[tests]]
name = "truthy_list_empty"
description = "bare truthiness on empty list evaluates to false"
template = '''
---
params: [items = list(str)]
---
> {% if items %}count={{ len(items) }}{% else %}no_items{% /if %}'''
expected_output = "no_items"
[tests.params]
items = []

[[tests]]
name = "not_has_negative_narrowing_carry"
description = "!has() guard carries unwrapped option type into fall-through else branch"
template = '''
---
params: [label = option(str) := None]
---
> {% if !has(label) %}default{% else %}{{ label }}{% /if %}'''
expected_output = "default"
params = {}

[[tests]]
name = "not_has_negative_narrowing_carry_present"
description = "!has() guard fall-through renders option inner value in else branch"
template = '''
---
params: [label = option(str) := None]
---
> {% if !has(label) %}default{% else %}{{ label }}{% /if %}'''
expected_output = "custom"
[tests.params]
label = "custom"

[[tests]]
name = "not_truthy_str_empty"
description = "negated truthiness on empty string is true"
template = '''
---
params: [title = str]
---
> {% if !title %}empty{% else %}non_empty{% /if %}'''
expected_output = "empty"
[tests.params]
title = ""

[[tests]]
name = "not_truthy_list_empty"
description = "negated truthiness on empty list is true"
template = '''
---
params: [items = list(str)]
---
> {% if !items %}no_items{% else %}has_items{% /if %}'''
expected_output = "no_items"
[tests.params]
items = []

[[tests]]
name = "compound_truthy_and_chain"
description = "str && list truthiness in conditional"
template = '''
---
params:
  - title = str
  - tags = list(str)
---
> {% if title && tags %}both_present{% else %}missing{% /if %}'''
expected_output = "both_present"
[tests.params]
title = "Hello"
tags = ["rust", "ts"]

[[tests]]
name = "compound_truthy_and_chain_one_missing"
description = "str && list truthiness returns false when one is empty"
template = '''
---
params:
  - title = str
  - tags = list(str)
---
> {% if title && tags %}both_present{% else %}missing{% /if %}'''
expected_output = "missing"
[tests.params]
title = "Hello"
tags = []

[[tests]]
name = "compound_not_truthy_or_chain"
description = "!a || !b boolean truthiness expression"
template = '''
---
params:
  - name = str
  - bio = str
---
> {% if !name || !bio %}incomplete{% else %}complete{% /if %}'''
expected_output = "incomplete"
[tests.params]
name = "Alice"
bio = ""

[[tests]]
name = "compound_parens_truthy_expression"
description = "Grouped boolean parens with truthiness and !"
template = '''
---
params:
  - title = str
  - subtitle = str
  - draft = bool
---
> {% if (title || subtitle) && !draft %}published{% else %}hidden{% /if %}'''
expected_output = "published"
[tests.params]
title = "My Post"
subtitle = ""
draft = false
