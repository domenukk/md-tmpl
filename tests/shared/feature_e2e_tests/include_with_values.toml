# Shared feature_e2e_tests: `{% include ... with key = <value> %}` value grammar.
#
# A `with` value is any general expression: a scalar literal (string, bool,
# int, float), a variable path, or a built-in function call, optionally
# followed by a filter chain. Rust and TypeScript must accept and render the
# same set.

[[tests]]
name = "include_with_bool_literal_true"
description = "A bare `true` literal is a valid `with` value for a bool param"
template = '''
---
allow_unused: true
params:
  - n = int
  - s = str
  - items = list(str)
---
> {% tmpl row %}

---
params:
  - v = bool
---

R: {% if v %}yes{% else %}no{% /if %}

> {% /tmpl %}

> {% include row with v = true %}
'''
expected_output = "\nR: yes"

[tests.params]
n = 3
s = "ab"
items = ["a", "b"]

[[tests]]
name = "include_with_bool_literal_false"
description = "A bare `false` literal is a valid `with` value (falsy in the child)"
template = '''
---
allow_unused: true
params:
  - n = int
  - s = str
  - items = list(str)
---
> {% tmpl row %}

---
params:
  - v = bool
---

R: {% if v %}yes{% else %}no{% /if %}

> {% /tmpl %}

> {% include row with v = false %}
'''
expected_output = "\nR: no"

[tests.params]
n = 3
s = "ab"
items = ["a", "b"]

