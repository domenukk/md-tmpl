allow_unused: true
params:
  - n = int
  - s = str
  - items = list(str)
---
> {% tmpl row %}

---
params:
  - v = str
---

R: {{ v }}

> {% /tmpl %}

> {% include row with v = s | upper %}
'''
expected_output = "\nR: AB\n"

[tests.params]
