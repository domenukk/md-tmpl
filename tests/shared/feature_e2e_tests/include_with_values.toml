  - n = int
  - s = str
  - items = list(str)
---
> {% tmpl row %}

---
params:
  - v = int
---

R: {{ v }}

> {% /tmpl %}

> {% include row with v = n | sub(1) %}
'''
expected_output = "\nR: 2\n"

